
[package]
name = "mauve"
version = "0.1.3"
edition = "2024"
description = "Lazy purely functional configuration language"
license = "MIT"
repository = "https://github.com/kisu-is/kisu"


[dependencies]
bumpalo = { version = "3.19.1", features = ["collections", "boxed"] }
logos = "0.16.0"
miette = { version = "7.6.0", features = ["fancy"] }
rpds = "1.2.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.18"

[dev-dependencies]
indoc = "2.0.7"

[features]
default = ["terminating"]
serde = ["dep:serde"]
terminating = []
impure = []

[workspace]
members = ["cli"]

[[test]]
name = "deserialize"
path = "tests/deserialize.rs"
required-features = ["serde"]
